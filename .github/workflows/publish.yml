name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A69DAD: ${{ secrets.A69DAD }}
          BE898E: ${{ secrets.BE898E }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A69DAD', '')
          sec_b = os.environ.get('BE898E', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 5e29d7a7c26648d50b7d6672f0a06da95dfcb5a01a864129 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- d0f266165208941957fb54 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
